<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1027 558" width="1027" height="558" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
<rect x="0" y="0" width="1027" height="558" rx="10" fill="#0d1117" stroke="#30363d"/>
<rect x="0" y="0" width="1027" height="30" rx="10" fill="#161b22"/>
<rect x="0" y="20" width="1027" height="10" fill="#161b22"/>
<circle cx="18" cy="15" r="5" fill="#ff5f57"/>
<circle cx="36" cy="15" r="5" fill="#febc2e"/>
<circle cx="54" cy="15" r="5" fill="#28c840"/>
<text x="514" y="20" fill="#6e7681" font-size="12" text-anchor="middle">sshkit --help</text>
<text x="18.0" y="46.0" fill="#c9d1d9" xml:space="preserve">usage: sshkit [-h] [--version]                                                                                        </text>
<text x="18.0" y="65.0" fill="#c9d1d9" xml:space="preserve">              {list,doctor,connect,dashboard,dashboard-config,monitor,agent-connect,exec,exec-tty,agent-exec,password,</text>
<text x="18.0" y="84.0" fill="#c9d1d9" xml:space="preserve">add}                                                                                                                  </text>
<text x="18.0" y="103.0" fill="#c9d1d9" xml:space="preserve">              ...                                                                                                     </text>
<text x="18.0" y="141.0" fill="#c9d1d9" xml:space="preserve">Cross-platform terminal SSH manager                                                                                   </text>
<text x="18.0" y="179.0" fill="#c9d1d9" xml:space="preserve">positional arguments:                                                                                                 </text>
<text x="18.0" y="198.0" fill="#c9d1d9" xml:space="preserve">  {list,doctor,connect,dashboard,dashboard-config,monitor,agent-connect,exec,exec-tty,agent-exec,password,add}        </text>
<text x="18.0" y="217.0" fill="#c9d1d9" xml:space="preserve">    list                List visible hosts                                                                            </text>
<text x="18.0" y="236.0" fill="#c9d1d9" xml:space="preserve">    doctor              Show environment checks                                                                       </text>
<text x="18.0" y="255.0" fill="#c9d1d9" xml:space="preserve">    connect             Connect to an alias                                                                           </text>
<text x="18.0" y="274.0" fill="#c9d1d9" xml:space="preserve">    dashboard           Connect with main SSH pane and monitor panes                                                  </text>
<text x="18.0" y="293.0" fill="#c9d1d9" xml:space="preserve">    dashboard-config    Configure a host's default dashboard                                                          </text>
<text x="18.0" y="312.0" fill="#c9d1d9" xml:space="preserve">    monitor             Run a single monitor pane (used by dashboards)                                                </text>
<text x="18.0" y="331.0" fill="#c9d1d9" xml:space="preserve">    agent-connect       Agent-safe saved-password SSH shell                                                           </text>
<text x="18.0" y="350.0" fill="#c9d1d9" xml:space="preserve">    exec                Run a remote command through sshkit                                                           </text>
<text x="18.0" y="369.0" fill="#c9d1d9" xml:space="preserve">    exec-tty            Run a remote command with an allocated TTY                                                    </text>
<text x="18.0" y="388.0" fill="#c9d1d9" xml:space="preserve">    agent-exec          Agent-safe alias for 'exec'                                                                   </text>
<text x="18.0" y="407.0" fill="#c9d1d9" xml:space="preserve">    password            Save an alias password to the system credential store                                         </text>
<text x="18.0" y="426.0" fill="#c9d1d9" xml:space="preserve">    add                 Add or update a managed host                                                                  </text>
<text x="18.0" y="464.0" fill="#c9d1d9" xml:space="preserve">options:                                                                                                              </text>
<text x="18.0" y="483.0" fill="#c9d1d9" xml:space="preserve">  -h, --help            show this help message and exit                                                               </text>
<text x="18.0" y="502.0" fill="#c9d1d9" xml:space="preserve">  --version             show program's version number and exit                                                        </text>
</svg>